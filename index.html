<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="12-todo-list.css">
  </head>
  <body>
    <div class="shell">
      <div class="box">
        <div class="header">
          <p class="title">Todo List</p>
          <p class="subtitle">Keep it simple — add, track, done.</p>
        </div>

        <div class="todo-input-grid">
          <div class="input-wrap">
            <input type="text" class="js-name-input name-input" placeholder="What needs to be done?" aria-label="Todo name">
          </div>
          <div class="input-wrap">
            <input type="date" class="js-due-date-input due-date-input" aria-label="Due date" required>
          </div>
          <button type="button" class="add-todo-button js-add-todo-btn">Add</button>
        </div>

        <div class="js-todo-list"></div>

        <div class="footer-hint">
          <span><kbd>↵</kbd> add</span>
          <span class="dot">•</span>
          <span>localStorage saved</span>
        </div>
      </div>
    </div>
    <script src="12-todo-list.js"></script>
  </body>
</html>
